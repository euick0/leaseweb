<div class="shell">
  <aside class="sidebar" aria-label="PatchPilot">
    <div class="sb-logo">PatchPilot</div>
    <nav class="sb-nav" aria-label="Sections">
      <a class="on" href="#top"><svg class="l"><use href="#i-dash"/></svg>Overview</a>
      <a href="#advisories"><svg class="l"><use href="#i-shield-alert"/></svg>Advisories<span class="count" id="nav-count" hidden></span></a>
      <a href="#workloads"><svg class="l"><use href="#i-server"/></svg>Fleet</a>
      <a href="#log"><svg class="l"><use href="#i-scroll"/></svg>Decision log</a>
    </nav>
    <div class="sb-foot">
      <div class="sb-model"><span class="av"><svg class="l"><use href="#i-cpu"/></svg></span><div><p class="n" id="model-name">Model</p><p class="e" id="model-mode">connecting</p></div></div>
      <div class="sb-model"><span class="av" id="me-initials">?</span><div><p class="n" id="me-name">Signing in</p><p class="e" id="me-role"></p></div></div>
    </div>
  </aside>

  <div class="main" id="top">
    <header class="hero">
      <div class="wrap">
        <div class="topbar">
          <div class="crumbs" id="crumbs">Overview</div>
          <div class="tb-actions">
            <button class="btn-ghost" id="refresh" type="button" title="Discover the fleet again"><svg class="l"><use href="#i-refresh"/></svg>Rediscover</button>
            <button class="btn-ghost" id="probe" type="button"><svg class="l"><use href="#i-radar"/></svg><span>Probe fleet</span></button>
            <button class="btn-white" id="simulate" type="button" aria-haspopup="true" aria-expanded="false"><svg class="l"><use href="#i-plus"/></svg>Simulate advisory</button>
            <div class="menu" id="scenarios" role="menu" hidden></div>
          </div>
        </div>
        <div id="hero-body"></div>
      </div>
    </header>

    <div class="wrap body">
      <div class="errbar" id="errors" role="alert" hidden></div>
      <div id="board"></div>
    </div>
  </div>
</div>
</body>
</html>
