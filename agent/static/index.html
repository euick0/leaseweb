<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatchPilot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='6' width='24' height='5' rx='1' fill='%233f6fa8'/%3E%3Crect x='1' y='13' width='24' height='5' rx='1' fill='%23b48a1f'/%3E%3Crect x='1' y='6' width='3' height='12' fill='%2315232e'/%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="top">
  <div class="mark">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="6" width="24" height="5" rx="1" fill="#3f6fa8"/><rect x="1" y="13" width="24" height="5" rx="1" fill="#b48a1f"/><rect x="1" y="6" width="3" height="12" fill="#15232e"/></svg>
    PatchPilot
  </div>
  <div class="model" id="model">Connecting to the fleet</div>
  <div class="acts">
    <div class="sim" id="scenarios" role="group" aria-label="Simulate an advisory"><span>Simulate</span></div>
    <button class="btn" id="probe" type="button">Probe fleet</button>
    <button class="btn" id="refresh" type="button">Rediscover</button>
  </div>
</header>
<nav class="tickets" id="tickets" aria-label="Advisories"></nav>
<main class="board" id="board">
  <div class="errbar" id="errors" role="alert" hidden></div>
  <div id="board-body"></div>
</main>
</body>
</html>
