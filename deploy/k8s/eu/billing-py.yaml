apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-py
  namespace: shop
  labels: {app.kubernetes.io/name: billing-py}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-py, track: stable}}
  template:
    metadata: {labels: {app: billing-py, track: stable, app.kubernetes.io/name: billing-py}}
    spec:
      containers:
        - name: app
          image: __REGISTRY__/billing-py:v1
          ports: [{containerPort: 8080}]
          env: [{name: DB_PASSWORD, value: demo-billing-db-password}, {name: PAYMENT_API_KEY, value: demo-not-a-real-key}]
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: billing-py
  namespace: shop
spec:
  selector: {app: billing-py, track: stable}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
# Gateway in front of billing-py: the only route in from the internet, and where
# virtual patches go (ConfigMap billing-py-gateway-mitigations).
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-py-gateway-conf
  namespace: shop
  labels: {patchpilot.io/role: gateway}
data:
  nginx.conf: |
    worker_processes 1;
    events { worker_connections 256; }
    http {
        access_log /dev/stdout;
        error_log /dev/stderr warn;
        server {
            listen 80;
            include /etc/nginx/pp/mitigations/*.conf;
            location = /gateway-health { return 200 "ok\n"; }
            location / {
                proxy_pass http://billing-py:8080;
                proxy_set_header Host $host;
                proxy_connect_timeout 2s;
                proxy_read_timeout 10s;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-py-gateway
  namespace: shop
  labels: {patchpilot.io/role: gateway}
  annotations: {patchpilot.io/gateway-for: billing-py}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-py-gateway}}
  template:
    metadata: {labels: {app: billing-py-gateway}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /gateway-health, port: 80}
            periodSeconds: 2
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}
            - {name: mitigations, mountPath: /etc/nginx/pp/mitigations}
      volumes:
        - name: conf
          configMap: {name: billing-py-gateway-conf}
        - name: mitigations
          configMap: {name: billing-py-gateway-mitigations, optional: true}
---
apiVersion: v1
kind: Service
metadata:
  name: billing-py-gateway
  namespace: shop
spec:
  type: LoadBalancer
  selector: {app: billing-py-gateway}
  ports: [{name: http, port: 8082, targetPort: 80}]
