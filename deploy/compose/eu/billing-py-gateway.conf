# Gateway in front of billing-py. Docker DNS is asked on every request (resolver), so a
# promoted container that takes over the "billing-py" alias gets traffic without a reload.
worker_processes 1;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    resolver 127.0.0.11 valid=2s ipv6=off;
    server {
        listen 80;
        include /etc/nginx/pp/mitigations/*.conf;
        location = /gateway-health { return 200 "ok\n"; }
        location / {
            set $upstream http://billing-py:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
